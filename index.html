<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>فحص هوستات IPTV</title>
<style>
*{-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,Tahoma,Arial;background:#111827;color:#fff;padding:20px;margin:0}
.container{max-width:900px;margin:auto}
h2{text-align:center;margin-bottom:20px}
input{width:100%;padding:14px;margin:8px 0;border:none;border-radius:10px;box-sizing:border-box;font-size:16px;background:#1f2937;color:#fff}
input::placeholder{color:#9ca3af}
button{width:100%;padding:16px;background:#22c55e;color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:17px;font-weight:bold;margin-top:8px}
button:disabled{background:#6b7280;cursor:not-allowed}
.card{background:#1f2937;margin-top:10px;padding:14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.host{word-break:break-all;font-size:13px;color:#e5e7eb}
.status{font-weight:bold;white-space:nowrap;font-size:14px}
.green{color:#22c55e}
.red{color:#ef4444}
.orange{color:#f59e0b}
.summary{background:#1f2937;padding:12px;border-radius:10px;margin-top:15px;text-align:center;font-size:14px}
</style>
</head>
<body>
<div class="container">
<h2>🔍 فحص هوستات IPTV</h2>
<input type="text" id="username" placeholder="Username" autocomplete="off" autocapitalize="off" autocorrect="off">
<input type="text" id="password" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off">
<button id="btn" onclick="checkHosts()">فحص الهوستات</button>
<div id="summary"></div>
<div id="results"></div>
</div>
<script>
const hosts=[
"c5fe0.rfcot.com:80",
"2bjrn.cafeg.org:80",
"onlvq.ultraplexa.com:80",
"smartott.org:80",
"vipxv.com:80",
"servx.pro:80",
"h8c0t.neovoxa.com:80",
"4c1xb.afcontube.com:80",
"lmwlp.arabcup.org:80",
"gndvp.nexovix.org:80",
"p6ham.teslaxspace.org:80",
"vz8yr.vipservicex.com:80",
"hvo3o.xelvia.org:80"
];

function pingHost(host, user, pass, timeout=8000){
 return new Promise((resolve)=>{
   const start=performance.now();
   const img=new Image();
   let done=false;
   const cleanup=()=>{img.onload=null;img.onerror=null;};
   const finish=(status)=>{
     if(done)return;
     done=true;
     cleanup();
     const ms=Math.round(performance.now()-start);
     resolve({status,ms});
   };
   img.onload=()=>finish("alive");
   img.onerror=()=>{
     const ms=performance.now()-start;
     if(ms<150)finish("dead");
     else finish("alive");
   };
   setTimeout(()=>finish("timeout"),timeout);
   img.src=`http://${host}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&t=${Date.now()}`;
 });
}

async function checkHosts(){
 const user=document.getElementById("username").value.trim();
 const pass=document.getElementById("password").value.trim();
 const btn=document.getElementById("btn");
 const results=document.getElementById("results");
 const summary=document.getElementById("summary");
 
 if(!user||!pass){
   alert("ادخل اليوزر والباسورد الأول");
   return;
 }
 
 btn.disabled=true;
 btn.textContent="جاري الفحص...";
 results.innerHTML="";
 summary.innerHTML="";
 
 const cards=[];
 hosts.forEach(host=>{
   const card=document.createElement("div");
   card.className="card";
   card.innerHTML=`<span class="host">${host}</span><span class="status orange">⏳ جاري الفحص...</span>`;
   results.appendChild(card);
   cards.push(card);
 });
 
 let working=0, dead=0;
 
 await Promise.all(hosts.map(async(host,i)=>{
   const result=await pingHost(host,user,pass);
   const card=cards[i];
   if(result.status==="alive"){
     working++;
     card.innerHTML=`<span class="host">${host}</span><span class="status green">🟢 يعمل (${result.ms} ms)</span>`;
   }else if(result.status==="timeout"){
     dead++;
     card.innerHTML=`<span class="host">${host}</span><span class="status red">⏱️ انتهت المهلة</span>`;
   }else{
     dead++;
     card.innerHTML=`<span class="host">${host}</span><span class="status red">🔴 لا يعمل</span>`;
   }
 }));
 
 summary.innerHTML=`<div class="summary">✅ يعمل: <span class="green">${working}</span> &nbsp;|&nbsp; ❌ لا يعمل: <span class="red">${dead}</span></div>`;
 btn.disabled=false;
 btn.textContent="فحص الهوستات مرة تانية";
}
</script>
</body>
</html>
